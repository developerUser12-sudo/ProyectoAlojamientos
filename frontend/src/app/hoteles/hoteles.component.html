<div class="container-fluid py-5 d-flex flex-column gap-5">
    <h2 class="text-center">¡Tus vacaciones están a punto de empezar!</h2>
    <div class="row justify-content-center mt-4">
        <div class="col-md-8">
            <form>
                <div class="input-group mb-3">
                    <input type="text" class="form-control" placeholder="Ubicación">
                    <select name="estrellas" id="">
                        <option value="1">⭐</option>
                        <option value="2">⭐⭐</option>
                        <option value="3">⭐⭐⭐</option>
                        <option value="4">⭐⭐⭐⭐</option>
                        <option value="5">⭐⭐⭐⭐⭐</option>
                    </select>
                    <input class="form-control" type="number" placeholder="Num personas" name="personas">
                    <button class="btn btn-primary" type="submit">Buscar</button>
                </div>
            </form>
        </div>
    </div>
    <div class="w-75 d-flex flex-column gap-3 m-auto ">
        <h4 class="mb-5">No se han encontrado resultados</h4>
        <h3 class="w-100">¿Te has fijado en nuestros mejores hoteles?</h3>
        <p>{{cargando}}</p>
        <div class="d-flex justify-content-center flex-wrap gap-3">
            <div *ngFor="let hotel of hoteles.slice(0,20)" class=" p-2 rounded card">
                <a [routerLink]="['/detalle-hotel', hotel.id]" routerLinkActive="active"
                    class="text-decoration-none text-black">
                    <img [src]="hotel.imagenes[0]" alt="Imagen hotel hotel.nombre"
                        style="width: 300px;height:200px;object-fit: cover;">
                    <div class="d-flex flex-row gap-5 mt-2">
                        <p><b>{{hotel.nombre}}</b></p>
                        <ng-container *ngFor="let star of stars(hotel.estrellas)">
                            ⭐
                        </ng-container>
                    </div>
                   
                        <p><i class="bi bi-geo-alt-fill"></i>{{hotel.direccion}}, {{hotel.localizacion}}</p>
                    
                    <div class="d-flex flex-row  gap-5">
                        <p>Capacidad total: {{hotel.capacidad}}</p>
                        <p><b>{{precioHabitacion(hotel.id)}}€</b></p>
                    </div>
                
                </a>
            </div>
        </div>
    </div>

</div>
