<div class="container mt-4 mx-auto" style="max-width: 700px;">

    <h4>Seleccione un método de pago</h4>
    <form (ngSubmit)="onSubmit()" class="d-flex flex-column gap-2 w-100 p-3">
        <div class="form-check">
            <input class="form-check-input" type="radio" name="metodoPago" id="tarjeta" value="tarjeta"
                [(ngModel)]="metodoPago">
            <label class="form-check-label" for="tarjeta">Tarjeta</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="metodoPago" id="efectivo" value="efectivo"
                [(ngModel)]="metodoPago">
            <label class="form-check-label" for="efectivo">Efectivo</label>
        </div>
        <div class="mt-3" *ngIf="metodoPago == 'tarjeta'">
            <label for="numTarjeta" class="form-label">Número de tarjeta (XXXX-XXXX-XXXX)</label>
            <input type="text" id="numTarjeta" class="form-control w-auto" [(ngModel)]="numeroTarjeta"
                name="numeroTarjeta">
        </div>
        <button *ngIf="!reservado" class="btn btn-primary w-75" type="submit" [disabled]="!isFormValid()">
            Reservar
        </button>
        <a *ngIf="reservado" routerLink="/" routerLinkActive="active" class="btn btn-success w-75">Volver a la página
            principal</a>
        <p *ngIf="reservado" class="text-success">Compra finalizada. Recibirás en tu correo electrónico los detalles</p>

    </form>
    <a *ngIf="!reservado" routerLink="/" routerLinkActive="active" class="btn btn-secondary ms-3">Cancelar</a>

    <h5 class="p-3">Tu producto:</h5>
    <div *ngIf="reserva.habitacionId > 0 && hotel" class="rounded card p-2 mt-4" style="width: 300px;">
            <img [src]="hotel.imagenes[0]" alt="Imagen hotel hotel.nombre"
                style="width: 300px; height:200px; object-fit: cover;" class="img-fluid">

            <div class="d-flex flex-row gap-5 mt-2">
                <p><b>{{hotel.nombre}}</b></p>
            </div>

            <p><i class="bi bi-geo-alt-fill"></i>{{hotel.direccion}}, {{hotel.localizacion}}</p>
        
    </div>
    <div class="p-3">
        <div *ngIf="reserva.idCoche > 0 && coche" class="rounded card p-2 mt-4" style="width: 300px;">
            
                <img [src]="coche.imagen" alt="Imagen coche coche.nombre"
                    style="width: 250px; height:150px; object-fit: cover;" class="img-fluid">

                <div class="d-flex flex-row gap-5 mt-2">
                    <p><b>{{coche.marca}} {{coche.modelo}}</b></p>
                </div>

                <p><i class="bi bi-geo-alt-fill"></i> De {{coche.origen}} a {{coche.destino}}</p>
           
        </div>
    </div>

</div>
